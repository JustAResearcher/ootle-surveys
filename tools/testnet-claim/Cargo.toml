[package]
name = "survey-testnet-claim"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
ootle-rs = "=0.24.0"
tari_crypto = "=0.23.4"
tari_ootle_transaction = "=0.42.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
anyhow = "1"
tari_common_types = "=6.0.1-pre.2"
tari_sidechain = "=6.0.1-pre.2"
tari_transaction_components = "=6.0.1-pre.2"
tari_engine_types = "=0.42.0"
tari_template_lib = "=0.33.0"
ootle_byte_type = { version = "=0.14.0", features = ["crypto"] }
borsh = "1"
bounded-vec = "0.9"
